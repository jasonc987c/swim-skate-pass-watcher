name: Check Swim & Skate pass

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub may delay scheduled runs by several minutes
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test Discord message"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: check-pass
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check availability
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BRANCHES: ${{ vars.BRANCHES }}
        run: python check_pass.py ${{ inputs.test && '--test' || '' }}

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update pass state"
            git push
          fi
